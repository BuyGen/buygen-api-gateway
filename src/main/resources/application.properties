spring.application.name=api-gateway
server.port=9000

#OpenAPI and Swagger
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-security-realm
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs
server.max-http-request-header-size=128KB

#Actuator Endpoints
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.cloud.gateway.mvc.routes.enabled=true
spring.main.lazy-initialization=true


#Resilience4j Properties
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=3s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

#Resilience4j TimeLimiter Config
resilience4j.timelimiter.configs.default.timeout-duration=3s

#Resilience4j Retry Properties
resilience4j.retry.configs.default.max-attempts=5
resilience4j.retry.configs.default.wait-duration=2s

#Observation
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observation.key-values.application=api-gateway
management.endpoint.health.show-details=always



# ===============================
# Tracing (Micrometer)
# ===============================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# ===============================
# Zipkin (Tracing Export)
# ===============================
management.zipkin.tracing.enabled=true
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ===============================
# Make observability NON-FATAL
# ===============================
logging.level.org.springframework.boot.actuate.autoconfigure.tracing=WARN
logging.level.zipkin2=ERROR
logging.level.brave=ERROR

# ===============================
# Loki (Log shipping)
# ===============================
logging.level.com.github.loki4j=WARN
logging.level.com.github.loki4j.client=ERROR